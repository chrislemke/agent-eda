[project]
name = "agent-eda"
version = "0.1.0"
description = "Deterministic exploratory data analysis functions for LLM agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris Lemke" }]
keywords = [
    "eda",
    "exploratory-data-analysis",
    "data-profiling",
    "data-quality",
    "pandas",
    "llm",
    "agents",
    "mcp",
]
# No License classifier: the license expression above says it (PEP 639).
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
requires-python = ">=3.12"
# Minimums match AWS AgentCore Code Interpreter's preinstalled versions (ADR 0005).
# The ADR allows six libraries; the package requires the ones its code imports.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "scipy>=1.11.2",
]

[project.urls]
Homepage = "https://github.com/chrislemke/agent-eda"
Source = "https://github.com/chrislemke/agent-eda"
Issues = "https://github.com/chrislemke/agent-eda/issues"
Changelog = "https://github.com/chrislemke/agent-eda/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# The MCP server (ADR 0006). mcp 2.3 needs pydantic 2.12; the core keeps 2.7.
mcp = ["mcp>=2.3", "pyarrow>=14.0.1"]

[project.scripts]
agent-eda-mcp = "agent_eda.mcp:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# A folder that Finder has opened holds a .DS_Store, which .gitignore hides from
# git but not from the build. tests/test_packaging.py builds a copy that has one.
source-exclude = ["**/.DS_Store"]
wheel-exclude = ["**/.DS_Store"]

[dependency-groups]
# The tests import anyio, jsonschema and annotated_types directly. They come with
# mcp or pydantic too, but a dependency that drops one must not break the tests.
dev = [
    "annotated-types>=0.6.0",
    "anyio>=4.9",
    "hypothesis>=6.170.1",
    "ipython>=9.0",
    "jsonschema>=4.20.0",
    "polars>=1.0",
    "pre-commit>=4.7.0",
    "pyarrow>=14.0.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "rich>=13.0",
    "ruff>=0.17.1",
    "threadpoolctl>=3.7.0",
    "ty>=0.0.89",
    "uv-build>=0.13.1,<0.14",
]
# The mcp extra, installed by default so that `uv run pytest` runs the MCP tests.
mcp = ["agent-eda[mcp]"]
# Selected with --no-group mcp --group core: the core alone, which the first
# minimum-versions run tests on pydantic 2.7, below the mcp extra's floor.
core = []

[tool.uv]
# uv 0.10 leaves the mcp extra out of `uv sync` and `uv run`; 0.13 installs it.
required-version = ">=0.13"
default-groups = ["dev", "mcp"]
# Without these, uv resolves every extra and group together, and the mcp extra's
# pydantic floor would lift the core's.
conflicts = [
    [{ extra = "mcp" }, { group = "core" }],
    [{ group = "mcp" }, { group = "core" }],
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PT",   # flake8-pytest-style
    "NPY",  # numpy-specific rules
    "PD",   # pandas-vet
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.pycodestyle]
# Docstring examples show printed results, whose lines run to 120 characters;
# the formatter still wraps code at line-length.
max-line-length = 124

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The benchmark only runs on request: uv run pytest -m benchmark
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not benchmark"]
markers = [
    "benchmark: times every analysis on 1,000,000 rows x 100 columns; run with -m benchmark",
]
# Deprecation and future warnings fail the suite, so code changes before the
# behaviour it relies on goes away.
filterwarnings = ["error::DeprecationWarning", "error::FutureWarning"]

[tool.coverage.run]
branch = true
# Measure the agent-eda-mcp process that the MCP tests start.
patch = ["subprocess"]
source = ["."]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
