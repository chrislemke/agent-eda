[project]
name = "agent-eda"
version = "0.1.0"
description = "Deterministic exploratory data analysis functions for LLM agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# Minimums match AWS AgentCore Code Interpreter's preinstalled versions (ADR 0005).
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "scikit-learn>=1.5",
    "scipy>=1.11.2",
    "statsmodels>=0.14.1",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.1",
    "ipython>=9.0",
    "polars>=1.0",
    "pre-commit>=4.7.0",
    "pyarrow>=14.0.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
    "threadpoolctl>=3.7.0",
    "ty>=0.0.89",
    "uv-build>=0.10.11,<0.11.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PT",   # flake8-pytest-style
    "NPY",  # numpy-specific rules
    "PD",   # pandas-vet
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.pycodestyle]
# Docstring examples show printed results, whose lines run to 120 characters;
# the formatter still wraps code at line-length.
max-line-length = 124

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The benchmark only runs on request: uv run pytest -m benchmark
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not benchmark"]
markers = [
    "benchmark: times every analysis on 1,000,000 rows x 100 columns; run with -m benchmark",
]
# Deprecation and future warnings fail the suite, so code changes before the
# behaviour it relies on goes away.
filterwarnings = ["error::DeprecationWarning", "error::FutureWarning"]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
