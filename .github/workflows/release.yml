# Pushing a version tag releases agent-eda: the full CI, the build, build
# provenance, publishing to PyPI (to TestPyPI for a release candidate) and, once
# the files are on the index, the GitHub release. docs/adr/0007 says why this is
# one workflow, and CONTRIBUTING.md gives the steps.
#
# The file name is part of the trusted publishers on PyPI and TestPyPI: renaming
# this file breaks publishing until both are changed too.
#
# Each job installs uv 0.13.1, as ci.yml does; bump the two together. No job uses
# the GitHub Actions cache, so a cache from another run can't reach a release.
name: Release

on:
  push:
    tags: ["v*"]

# Each job below asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  ci:
    name: CI, benchmark included
    permissions:
      contents: read
    # zizmor's self-repository note suggests $/.github/workflows/ci.yml, which
    # actionlint rejects, so the relative path stays.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    with:
      full: true

  build:
    name: build and check the files
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.route.outputs.version }}
      index: ${{ steps.route.outputs.index }}
      repository_url: ${{ steps.route.outputs.repository_url }}
      prerelease: ${{ steps.route.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: false
      # Nothing is built for upload when the tag and the package disagree.
      # tests/test_ci_workflow.py runs this script and the next.
      - name: Check the tag against the package version and pick the index
        id: route
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv version --short)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error title=The tag and the version differ::The tag is $TAG, but pyproject.toml says version $version. Delete the tag, set the version with 'uv version <new>', commit, and tag that commit as v<new>."
            exit 1
          fi
          if [[ "$version" =~ rc[0-9]+$ ]]; then
            index=testpypi
            repository_url=https://test.pypi.org/legacy/
            prerelease=true
          elif [[ "$version" =~ [0-9](a|b)[0-9]+$ ]]; then
            index=pypi
            repository_url=https://upload.pypi.org/legacy/
            prerelease=true
          elif [[ "$version" =~ ^[0-9]+(\.[0-9]+)*(\.post[0-9]+)?$ ]]; then
            index=pypi
            repository_url=https://upload.pypi.org/legacy/
            prerelease=false
          else
            echo "::error title=No index for this version::Version $version is none of a final release (0.1.0, 0.1.0.post1), a pre-release (0.1.0a1, 0.1.0b1) or a release candidate (0.1.0rc1), so no index takes it."
            exit 1
          fi
          {
            echo "version=$version"
            echo "index=$index"
            echo "repository_url=$repository_url"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      # A release candidate or pre-release that has no section of its own takes
      # the Unreleased one. A final release needs its own, before anything is
      # published, since the GitHub release comes last.
      - name: Take the release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ steps.route.outputs.version }}
          PRERELEASE: ${{ steps.route.outputs.prerelease }}
        run: |
          section() {
            awk -v heading="$1" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
              END { exit !found }
            ' CHANGELOG.md
          }
          mkdir -p "$RUNNER_TEMP/release-notes"
          notes="$RUNNER_TEMP/release-notes/RELEASE_NOTES.md"
          if section "## [$VERSION]" > "$notes"; then
            :
          elif [ "$PRERELEASE" = true ] && section "## [Unreleased]" > "$notes"; then
            :
          else
            echo "::error title=No release notes::CHANGELOG.md has no section headed '## [$VERSION]'. Move the lines under '## [Unreleased]' into it, commit, and move the tag to that commit."
            exit 1
          fi
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error title=Empty release notes::The CHANGELOG.md section for $VERSION is empty. Say what changed for a caller."
            exit 1
          fi
      - name: Build the wheel and the source distribution
        run: uv build --force-pep517
      - name: Check the metadata and the contents of the files
        run: |
          uvx twine@7.0.0 check --strict dist/*
          uvx check-wheel-contents@0.6.3 dist/*.whl
      # Each file goes into a fresh environment with its dependencies, as pip
      # install gets them from PyPI, and prints every analysis's examples.
      - name: Smoke test an install of the wheel and of the source distribution
        run: |
          for file in dist/*.whl dist/*.tar.gz; do
            environment="$RUNNER_TEMP/smoke-$(basename "$file")"
            uv venv --python 3.12 "$environment"
            uv pip install --python "$environment" "$file"
            "$environment/bin/python" -I tests/smoke.py
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes/RELEASE_NOTES.md
          if-no-files-found: error

  provenance:
    name: attest where the files were built
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write # the OIDC token that signs the attestation
      attestations: write # stores the attestation in the repository
      artifact-metadata: write # records the files as build artifacts of the repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

  publish:
    name: publish to ${{ needs.build.outputs.index }}
    needs: [build, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The index has the name of its environment: pypi or testpypi. The pypi
    # environment waits for the maintainer's approval, which gates the upload.
    environment: ${{ needs.build.outputs.index }}
    # The only job that can mint a token for the index, and it runs no code of ours.
    permissions:
      id-token: write # trusted publishing: the index trades this OIDC token for an upload token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # PEP 740 attestations are on by default with trusted publishing.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          repository-url: ${{ needs.build.outputs.repository_url }}

  github-release:
    name: create the GitHub release
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # creates the release and uploads its files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release-notes/
      # Runs only after publishing, so a GitHub release has files on an index.
      # --verify-tag fails instead of creating a tag that doesn't exist.
      - name: Create the release with the wheel and the source distribution
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            kind=(--prerelease --latest=false)
          else
            kind=(--latest)
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "agent-eda $VERSION" \
            --notes-file release-notes/RELEASE_NOTES.md \
            "${kind[@]}"
