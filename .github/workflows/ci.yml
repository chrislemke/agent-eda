# Every push and pull request runs the checks AgentCore users depend on. The
# benchmark runs only when started by hand: Actions > CI > Run workflow.
#
# Each job installs uv 0.13.1, the version the uv-lock pre-commit hook runs;
# bump the two together. The jobs skip the GitHub Actions cache. They install
# only prebuilt wheels, and setup-uv would give the minimum-versions runs the
# same cache key as the latest-versions runs.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: false
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ty check

  tests-latest:
    name: tests, latest versions (Python ${{ matrix.python }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.12", arch: x86_64, runner: ubuntu-24.04 }
          - { python: "3.13", arch: x86_64, runner: ubuntu-24.04 }
          - { python: "3.14", arch: x86_64, runner: ubuntu-24.04 }
          - { python: "3.12", arch: ARM64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: false
          python-version: ${{ matrix.python }}
      # The versions in uv.lock; --locked fails if the lock is out of date.
      # --extra mcp, so the MCP server tests run rather than skip.
      - run: uv run --locked --extra mcp pytest

  tests-minimum:
    name: tests, minimum versions (Python 3.12, x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: false
      # The README's command; tests/test_ci_workflow.py fails if the two differ.
      # Python 3.12, because numpy 1.26 has no wheels for 3.13.
      - name: Test on the minimum versions
        run: uv run --isolated --resolution lowest-direct --no-group mcp --group core --python 3.12 pytest

  tests-minimum-mcp:
    name: tests, minimum versions with the mcp extra (Python 3.12, x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: false
      # The README's command; tests/test_ci_workflow.py fails if the two differ.
      # The extra at its floors (mcp 2.3, pyarrow 14.0.1) and the pydantic 2.12
      # that mcp needs, so the whole suite runs, the MCP tests included.
      - name: Test on the minimum versions with the mcp extra
        run: uv run --isolated --resolution lowest-direct --extra mcp --python 3.12 pytest

  mcp-smoke:
    name: MCP server over stdio (Python ${{ matrix.python }}, x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.12" }
          - { python: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: false
          python-version: ${{ matrix.python }}
      # Starts agent-eda-mcp as an MCP client does and calls one MCP tool. Unlike
      # the MCP test modules, the script fails rather than skips without the extra.
      - name: Smoke test the MCP server over stdio
        run: uv run --locked --extra mcp python -I tests/smoke_mcp.py

  packaging:
    name: packaging, offline install routes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: false
      # --force-pep517 builds with the uv_build that [build-system] declares,
      # as pip would, not with the copy bundled in this uv.
      - name: Build the wheel
        run: uv build --wheel --force-pep517
      # The packaging tests check the wheel AGENT_EDA_WHEEL names: pure Python,
      # importable from sys.path in an isolated interpreter.
      - name: Check that the wheel is pure Python and imports from sys.path
        run: AGENT_EDA_WHEEL="$(echo dist/*.whl)" uv run --locked pytest tests/test_packaging.py
      # Only the six required dependencies, at the minimums in pyproject.toml.
      - name: Create an environment with only the minimum required versions
        run: |
          uv venv --seed --python 3.12 "$RUNNER_TEMP/minimum"
          uv pip install --python "$RUNNER_TEMP/minimum" --resolution lowest-direct -r pyproject.toml
      # As in an AgentCore sandbox without PyPI access; --no-index keeps pip
      # off the network.
      - name: Install the wheel with pip install --no-deps
        run: |
          "$RUNNER_TEMP/minimum/bin/python" -m pip install --no-deps --no-index dist/*.whl
          "$RUNNER_TEMP/minimum/bin/python" -m pip check
      - name: Smoke test that prints analysis results
        run: |
          "$RUNNER_TEMP/minimum/bin/python" -I tests/smoke.py

  benchmark:
    name: benchmark, ${{ matrix.versions }} versions (Python 3.12, ARM64, 2 CPUs)
    if: github.event_name == 'workflow_dispatch'
    # An AgentCore session has 2 vCPUs, and AgentCore Runtime runs on ARM64.
    # taskset keeps the run on 2 of the runner's CPUs, which on ARM64 are
    # whole cores, as Graviton vCPUs are.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        versions: [latest, minimum]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: false
      - name: Benchmark on 2 CPUs with the latest versions
        if: matrix.versions == 'latest'
        run: taskset --cpu-list 0,1 uv run --locked pytest -m benchmark
      - name: Benchmark on 2 CPUs with the minimum versions
        if: matrix.versions == 'minimum'
        run: taskset --cpu-list 0,1 uv run --isolated --resolution lowest-direct --no-group mcp --group core --python 3.12 pytest -m benchmark
